<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구매상담 신청</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="consult-wrap">
        <h2>구매상담 신청</h2>
        <p class="sub-text">현대자동차 차량 구매 정보를 손쉽고 간편하게 알려드립니다.</p>

        <div class="tab-menu">
            <button class="tab">승용 차종</button>
            <button class="tab active">상용 차종</button>
        </div>

        <div class="steps">
            <div class="step">
                <div class="circle"></div>
                <p>01. 차량 선택</p>
            </div>
            <div class="step">
                <div class="circle"></div>
                <p>02. 차량/옵션 보는 카마스터 선택</p>
            </div>
            <div class="step">
                <div class="circle"></div>
                <p>03. 구매상담 신청완료</p>
            </div>
            <div class="step">
                <div class="circle"></div>
                <p>04. PR센터 안내 전화 및 차량주차 상담연락</p>
            </div>
        </div>

        <div class="button-group">
            <button class="btn primary">구매상담 신청</button>
            <button class="btn secondary">비회원 신청조회</button>
        </div>
    </section>
</body>
</html>
